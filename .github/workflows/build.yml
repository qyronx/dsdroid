name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # 태그 푸시 시 Release 에 APK 첨부

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu 러너에는 Android SDK 가 이미 설치되어 있으므로 라이선스만 동의
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # DeSmuME libretro 코어(.so)를 받아 jniLibs 에 넣는다.
      # (GPL 코어를 저장소에 올리지 않고 빌드 때마다 내려받음)
      - name: Download DeSmuME libretro core
        run: |
          set -euxo pipefail
          CORE=desmume
          for ABI in arm64-v8a armeabi-v7a; do
            mkdir -p "app/src/main/jniLibs/$ABI" "/tmp/core_$ABI"
            curl -fL --retry 3 \
              "https://buildbot.libretro.com/nightly/android/latest/$ABI/${CORE}_libretro_android.so.zip" \
              -o "/tmp/core_$ABI.zip"
            unzip -o "/tmp/core_$ABI.zip" -d "/tmp/core_$ABI"
            mv "/tmp/core_$ABI/${CORE}_libretro_android.so" "app/src/main/jniLibs/$ABI/lib${CORE}_libretro_android.so"
            ls -l "app/src/main/jniLibs/$ABI"
          done

      - name: Build release APK (debug 키 서명, 네트워크 오류 대비 최대 3회 재시도)
        run: |
          for i in 1 2 3; do
            if [ "$i" -eq 1 ]; then EXTRA=""; else EXTRA="--refresh-dependencies"; fi
            gradle assembleRelease --stacktrace --no-daemon $EXTRA && exit 0
            echo "빌드 실패 (시도 $i/3) - 30초 후 재시도"
            sleep 30
          done
          exit 1

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk DSDroid.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DSDroid-apk
          path: DSDroid.apk

      - name: Attach APK to GitHub Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: DSDroid.apk
